name: Build Wallpaper Gallery Desktop

on:
  workflow_call:
    inputs:
      source_repository:
        description: "Repository that owns the Wallpaper Gallery desktop release"
        required: true
        type: string
      source_ref:
        description: "Wallpaper Gallery source ref used for desktop assets such as the icon"
        required: false
        type: string
        default: "main"
      release_tag:
        description: "Stable Wallpaper Gallery desktop release tag"
        required: false
        type: string
        default: "desktop"
      url:
        description: "Wallpaper Gallery URL"
        required: false
        type: string
        default: "https://wallpaper.061129.xyz/"
      width:
        description: "Initial window width"
        required: false
        type: number
        default: 1600
      height:
        description: "Initial window height"
        required: false
        type: number
        default: 900

jobs:
  build:
    name: Wallpaper Gallery (${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
          - build: macos
            os: macos-latest
          - build: windows
            os: windows-latest

    steps:
      - name: Checkout Pake
        uses: actions/checkout@v6
        with:
          repository: IT-NuanxinPro/Pake
          ref: main

      - name: Checkout Wallpaper Gallery source
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.source_repository }}
          ref: ${{ inputs.source_ref }}
          path: wallpaper-source

      - name: Validate desktop assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "wallpaper-source/public/favicon.svg" || {
            echo "Missing wallpaper-source/public/favicon.svg"
            exit 1
          }
          test -f "wallpaper-source/public/pake-auth-navigation.js" || {
            echo "Missing wallpaper-source/public/pake-auth-navigation.js"
            exit 1
          }

      - name: Resolve application version
        shell: bash
        run: |
          node -e 'const fs = require("node:fs"); const { version } = require("./wallpaper-source/package.json"); if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error("Invalid application version"); fs.appendFileSync(process.env.GITHUB_ENV, "WALLPAPER_APP_VERSION=" + version + "\n");'

      - name: Setup build environment
        uses: ./.github/actions/setup-env
        with:
          mode: build

      - name: Build Pake CLI
        run: pnpm run cli:build

      - name: Setup mold linker
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@v1

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail

          node dist/cli.js "${{ inputs.url }}" \
            --name "Wallpaper Gallery" \
            --app-version "$WALLPAPER_APP_VERSION" \
            --icon "wallpaper-source/public/favicon.svg" \
            --inject "wallpaper-source/public/pake-auth-navigation.js" \
            --width "${{ inputs.width }}" \
            --height "${{ inputs.height }}" \
            --targets deb,appimage

          mkdir -p output/linux

          DEB="$(find . -maxdepth 1 -type f -name '*.deb' -print -quit)"
          if [ -z "$DEB" ]; then
            DEB="$(find src-tauri/target -type f -path '*/bundle/deb/*.deb' -print -quit)"
          fi

          APPIMAGE="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [ -z "$APPIMAGE" ]; then
            APPIMAGE="$(find src-tauri/target -type f -path '*/bundle/appimage/*.AppImage' -print -quit)"
          fi

          test -n "$DEB" || { echo "No DEB package found"; exit 1; }
          test -n "$APPIMAGE" || { echo "No AppImage package found"; exit 1; }

          mv "$DEB" "output/linux/Wallpaper-Gallery-linux-x86_64.deb"
          mv "$APPIMAGE" "output/linux/Wallpaper-Gallery-linux-x86_64.AppImage"

      - name: Build macOS package
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 30
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail

          node dist/cli.js "${{ inputs.url }}" \
            --name "Wallpaper Gallery" \
            --app-version "$WALLPAPER_APP_VERSION" \
            --icon "wallpaper-source/public/favicon.svg" \
            --inject "wallpaper-source/public/pake-auth-navigation.js" \
            --width "${{ inputs.width }}" \
            --height "${{ inputs.height }}" \
            --multi-arch

          mkdir -p output/macos

          DMG="$(find . -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [ -z "$DMG" ]; then
            DMG="$(find src-tauri/target -type f -path '*/bundle/dmg/*.dmg' -print -quit)"
          fi

          test -n "$DMG" || { echo "No DMG package found"; exit 1; }
          mv "$DMG" "output/macos/Wallpaper-Gallery-macOS-universal.dmg"

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"

          node dist/cli.js "${{ inputs.url }}" `
            --name "Wallpaper Gallery" `
            --app-version "$env:WALLPAPER_APP_VERSION" `
            --icon "wallpaper-source/public/favicon.svg" `
            --inject "wallpaper-source/public/pake-auth-navigation.js" `
            --width "${{ inputs.width }}" `
            --height "${{ inputs.height }}"

          New-Item -Path "output/windows" -ItemType Directory -Force | Out-Null

          $msi = Get-ChildItem -Path . -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) {
            $msi = Get-ChildItem -Path "src-tauri/target" -Recurse -Filter "*.msi" -File | Select-Object -First 1
          }

          if (-not $msi) {
            throw "No MSI package found"
          }

          Move-Item $msi.FullName "output/windows/Wallpaper-Gallery-Windows-x64.msi"

      - name: Record installer version
        shell: bash
        run: |
          mkdir -p output/metadata
          printf '%s\n' "$WALLPAPER_APP_VERSION" > "output/metadata/version-${{ matrix.build }}.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: Wallpaper-Gallery-${{ matrix.build }}
          path: output/**/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Update stable desktop release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: Wallpaper-Gallery-*
          path: release
          merge-multiple: true

      - name: Publish stable Wallpaper Gallery desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_REF: ${{ inputs.source_ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          APP_VERSION="$(node -e 'const fs = require("node:fs"); const versions = ["linux", "macos", "windows"].map(platform => fs.readFileSync("release/metadata/version-" + platform + ".txt", "utf8").trim()); if (new Set(versions).size !== 1 || !/^\d+\.\d+\.\d+$/.test(versions[0])) throw new Error("Installer versions do not match"); process.stdout.write(versions[0]);')"
          export APP_VERSION

          if ! gh release view "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$SOURCE_REPOSITORY" \
              --target "$SOURCE_REF" \
              --title "Wallpaper Gallery Desktop" \
              --notes "Wallpaper Gallery 桌面客户端稳定下载入口。客户端加载线上站点，网站内容更新无需重新安装；仅在桌面壳、图标或原生能力变化时重新构建。"
          fi

          mapfile -t ASSETS < <(find release -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \) -print | sort)
          test "${#ASSETS[@]}" -eq 4 || { echo "Expected four desktop assets"; exit 1; }

          gh release view "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --json body --jq .body > desktop-notes.txt
          node -e 'const fs = require("node:fs"); const body = fs.readFileSync("desktop-notes.txt", "utf8").replace(/<!-- wallpaper-desktop-version:[^>]* -->/g, "").trim(); fs.writeFileSync("desktop-notes.txt", body + "\n");'
          gh release edit "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --notes-file desktop-notes.txt

          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" \
            --repo "$SOURCE_REPOSITORY" \
            --clobber

          node -e 'const fs = require("node:fs"); fs.appendFileSync("desktop-notes.txt", "\n<!-- wallpaper-desktop-version:" + process.env.APP_VERSION + " -->\n");'
          gh release edit "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --notes-file desktop-notes.txt

          # Publish a same-origin manifest after every installer is available.
          gh release view "$RELEASE_TAG" --repo "$SOURCE_REPOSITORY" --json assets > uploaded-assets.json
          gh api "repos/$SOURCE_REPOSITORY/contents/public/desktop-release.json?ref=$SOURCE_REF" > existing-manifest.json
          node <<'NODE'
          const fs = require('node:fs');
          const existing = JSON.parse(fs.readFileSync('existing-manifest.json', 'utf8'));
          const { assets } = JSON.parse(fs.readFileSync('uploaded-assets.json', 'utf8'));
          const base = 'https://github.com/' + process.env.SOURCE_REPOSITORY + '/releases';
          const names = { windows: 'Wallpaper-Gallery-Windows-x64.msi', macos: 'Wallpaper-Gallery-macOS-universal.dmg', linux: 'Wallpaper-Gallery-linux-x86_64.AppImage', deb: 'Wallpaper-Gallery-linux-x86_64.deb' };
          const downloads = {};
          let publishedAt = '';
          for (const [platform, name] of Object.entries(names)) {
            const asset = assets.find(item => item.name === name && item.state === 'uploaded' && item.size > 0);
            if (!asset) throw new Error('Missing installer: ' + name);
            downloads[platform] = base + '/download/' + process.env.RELEASE_TAG + '/' + name;
            if (asset.updatedAt > publishedAt) publishedAt = asset.updatedAt;
          }
          const manifest = { available: true, version: process.env.APP_VERSION, publishedAt, releaseUrl: base + '/tag/' + process.env.RELEASE_TAG, notesUrl: base + '/tag/v' + process.env.APP_VERSION, downloads };
          const content = Buffer.from(JSON.stringify(manifest, null, 2) + '\n').toString('base64');
          fs.writeFileSync('manifest-payload.json', JSON.stringify({ message: 'chore: publish desktop update manifest', content, sha: existing.sha, branch: process.env.SOURCE_REF }));
          NODE
          gh api "repos/$SOURCE_REPOSITORY/contents/public/desktop-release.json" --method PUT --input manifest-payload.json
          gh workflow run deploy.yml --repo "$SOURCE_REPOSITORY" --ref "$SOURCE_REF"
