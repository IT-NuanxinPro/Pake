<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wallpaper Gallery</title>
  </head>
  <body>
    <!-- startup-surface -->
    <style>
      #wallpaper-startup {
        --launch-bg: #f8f9fa;
        --launch-ink: #1a1a2e;
        --launch-muted: #6c757d;
        --launch-line: #e2e4ed;
        --launch-accent: #6366f1;
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        margin: 0;
        padding: 28px;
        color: var(--launch-ink);
        background: var(--launch-bg);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        text-align: center;
        opacity: 1;
        transition: opacity 240ms ease;
        -webkit-app-region: drag;
      }
      @media (prefers-color-scheme: dark) {
        #wallpaper-startup {
          --launch-bg: #0f0f1a;
          --launch-ink: #f8f9fa;
          --launch-muted: #a0a0b0;
          --launch-line: #2a2a42;
          --launch-accent: #818cf8;
        }
      }
      [data-theme="light"] #wallpaper-startup {
        --launch-bg: #f8f9fa;
        --launch-ink: #1a1a2e;
        --launch-muted: #6c757d;
        --launch-line: #e2e4ed;
        --launch-accent: #6366f1;
      }
      [data-theme="dark"] #wallpaper-startup {
        --launch-bg: #0f0f1a;
        --launch-ink: #f8f9fa;
        --launch-muted: #a0a0b0;
        --launch-line: #2a2a42;
        --launch-accent: #818cf8;
      }
      #wallpaper-startup .launch-content {
        width: min(100%, 360px);
      }
      #wallpaper-startup .launch-symbol {
        width: 72px;
        height: 72px;
        margin: 0 auto 25px;
      }
      #wallpaper-startup .launch-symbol svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #wallpaper-startup .launch-title {
        margin: 0;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.7px;
      }
      #wallpaper-startup .launch-caption {
        margin: 7px 0 29px;
        color: var(--launch-muted);
        font-size: 12px;
        letter-spacing: 2px;
      }
      #wallpaper-startup .launch-activity {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 6px;
        height: 12px;
      }
      #wallpaper-startup .launch-activity i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--launch-accent);
        animation: wallpaper-launch-pulse 1500ms ease-in-out infinite;
      }
      #wallpaper-startup .launch-activity i:nth-child(2) {
        animation-delay: 150ms;
      }
      #wallpaper-startup .launch-activity i:nth-child(3) {
        animation-delay: 300ms;
      }
      #wallpaper-startup-message {
        margin: 13px 0 0;
        min-height: 23px;
        color: var(--launch-muted);
        font-size: 12px;
      }
      #wallpaper-startup-retry {
        margin: 18px 0 0;
        padding: 7px 18px;
        border: 1px solid var(--launch-line);
        border-radius: 8px;
        color: var(--launch-ink);
        background: transparent;
        font: inherit;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      #wallpaper-startup-retry:hover {
        border-color: var(--launch-accent);
      }
      #wallpaper-startup-retry:focus-visible {
        outline: 2px solid var(--launch-accent);
        outline-offset: 3px;
      }
      #wallpaper-startup [hidden] {
        display: none !important;
      }
      #wallpaper-startup[data-state="leaving"] {
        opacity: 0;
        pointer-events: none;
      }
      #wallpaper-startup[data-state="slow"] .launch-activity i {
        animation: none;
        opacity: 0.5;
      }
      html[data-wallpaper-startup="loading"] #app {
        visibility: hidden !important;
      }
      @keyframes wallpaper-launch-pulse {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #wallpaper-startup {
          transition: none;
        }
        #wallpaper-startup .launch-activity i {
          animation: none;
          opacity: 0.6;
        }
      }
    </style>
    <section
      id="wallpaper-startup"
      role="status"
      aria-live="polite"
      aria-busy="true"
    >
      <div class="launch-content">
        <div class="launch-symbol" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="23" fill="#6366f1" />
            <rect
              x="20"
              y="20"
              width="60"
              height="60"
              rx="8"
              fill="none"
              stroke="white"
              stroke-width="4"
            />
            <circle cx="35" cy="35" r="8" fill="white" />
            <path
              d="M80 60 L55 40 L20 80"
              stroke="white"
              stroke-width="4"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <h1 class="launch-title">Wallpaper Gallery</h1>
        <p class="launch-caption">为你的屏幕，换一处风景</p>
        <div class="launch-activity" aria-hidden="true">
          <i></i><i></i><i></i>
        </div>
        <p id="wallpaper-startup-message">正在打开壁纸馆</p>
        <button id="wallpaper-startup-retry" type="button" hidden>
          重新连接
        </button>
      </div>
    </section>
    <!-- /startup-surface -->
  </body>
</html>
